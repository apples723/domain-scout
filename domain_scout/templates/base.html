<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Domain Scout{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2024; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb; --ok: #167c4a; --warn: #9a6700; --bad: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 0 24px; display: flex; align-items: center; gap: 28px;
  }
  header .brand { font-weight: 650; font-size: 16px; padding: 16px 0; }
  header a { color: var(--muted); text-decoration: none; padding: 16px 0; font-size: 14px; }
  header a:hover { color: var(--ink); }
  header a.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 64px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
  .hint { color: var(--muted); font-weight: 400; font-size: 12.5px; }
  input[type=text], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 14px; font-family: inherit; background: #fff;
  }
  textarea { min-height: 190px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .row > * { flex: 1 1 260px; }
  .field { margin-bottom: 18px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .check input { width: 16px; height: 16px; }
  button, .btn {
    display: inline-block; background: var(--accent); color: #fff; border: 0;
    padding: 9px 16px; border-radius: 7px; font-size: 14px; font-weight: 550;
    cursor: pointer; text-decoration: none; font-family: inherit;
  }
  button:hover, .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--bad); border: 1px solid #f0c6c2; }
  .btn.sm { padding: 5px 11px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 8px 10px; border-bottom: 1px solid #f0f2f4; vertical-align: top; }
  tbody tr:hover > td { background: #fafbfc; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .trunc { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 11.5px; font-weight: 600; background: #eef1f4; color: var(--muted);
  }
  .badge.done { background: #e7f5ee; color: var(--ok); }
  .badge.running, .badge.queued { background: #fff4dc; color: var(--warn); }
  .badge.failed, .badge.interrupted { background: #fdeceb; color: var(--bad); }
  .yes { color: var(--ok); font-weight: 600; }
  .no { color: var(--muted); }
  .err { color: var(--bad); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 12px 16px; min-width: 108px;
  }
  .stat .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  details.expand > summary {
    cursor: pointer; padding: 6px 0; font-size: 13px; color: var(--accent);
    font-weight: 550; list-style: none; display: inline-flex; align-items: center; gap: 6px;
  }
  details.expand > summary::-webkit-details-marker { display: none; }
  details.expand > summary::before { content: "▸"; font-size: 11px; }
  details.expand[open] > summary::before { content: "▾"; }
  .expand-body { padding: 6px 0 14px; }
  .expand-row > td { background: #fbfcfd; padding-top: 0; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 24px; }
  .kv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kv .v { font-size: 14px; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 18px; font-size: 13.5px; }
  .banner {
    border-left: 3px solid var(--accent); background: #eff4ff;
    padding: 11px 15px; border-radius: 6px; font-size: 13.5px; margin-bottom: 18px;
  }
  .banner.bad { border-color: var(--bad); background: #fdeceb; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  form.inline { display: inline; }
</style>
</head>
<body>
<header>
  <span class="brand">Domain Scout</span>
  <a href="/" class="{{ 'on' if nav == 'new' }}">New scan</a>
  <a href="/runs" class="{{ 'on' if nav == 'history' }}">History</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
